<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">Videy</header>

<main class="container">

  <div class="video-wrapper">

    <video id="video" controls playsinline>
        <source src="https://cdn2.videi.in/bQcZokrA.mp4" type="video/mp4">
    </video>

    <button id="videoOverlay" aria-label="overlay">
        <span class="overlay-text"></span>
    </button>

    <button class="icon-btn wa" onclick="joinWhatsAppGroup()">
        <img src="whatsapp.png">
        <span>Full Video</span>
    </button>

    <button class="icon-btn fb" onclick="openFacebookPage()">
        <img src="facebook.png">
        <span>Video Lainnya</span>
    </button>

  </div>

  <button class="share-btn" id="shareBtn">📁 Video Viral Terbaru</button>

</main>

<script src="main.js"></script>

</body>
</html>
